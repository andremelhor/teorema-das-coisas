<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Harry Potter - Hogwarts Ludo 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a14;overflow:hidden;font-family:'Georgia',serif}
  canvas{display:block}
  #ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}
  #ui h1{font-size:1.4rem;color:#f0c040;text-shadow:0 0 18px #f0c04099;letter-spacing:5px}
  #ui p{font-size:.65rem;color:#aaa;letter-spacing:3px;margin-top:2px}
  #bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center}
  .btn{background:rgba(255,255,255,.07);border:1px solid rgba(240,192,64,.4);color:#f0c040;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.72rem;letter-spacing:1px;backdrop-filter:blur(6px);transition:background .2s}
  .btn:hover{background:rgba(240,192,64,.2)}
  #turn{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);color:#fff;padding:7px 20px;border-radius:20px;font-size:.78rem;letter-spacing:2px;z-index:10}
  #dice-box{position:fixed;right:20px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px;text-align:center;z-index:10;min-width:68px}
  #dface{font-size:2.6rem;line-height:1}
  #dval{color:#f0c040;font-size:.8rem;margin-top:4px;letter-spacing:1px}
  #sel-lbl{position:fixed;top:112px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border-radius:20px;padding:5px 16px;font-size:.72rem;letter-spacing:2px;z-index:10;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid transparent}
  #hint{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);color:#555;font-size:.63rem;letter-spacing:2px;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="ui"><h1>* HOGWARTS LUDO *</h1><p>WIZARDING BOARD GAME - 3D EDITION</p></div>
<div id="turn">TURNO: <span id="tname" style="color:#e84040">GRIFINORIA</span></div>
<div id="sel-lbl"></div>
<div id="dice-box"><div id="dface">5</div><div id="dval">-</div></div>
<div id="hint">CLIQUE no peao | CLIQUE no tabuleiro para mover | DRAG para rotar</div>
<div id="bar">
  <button class="btn" onclick="rollDice()">ROLAR DADO</button>
  <button class="btn" onclick="toggleAuto()">AUTO-ROTAR</button>
  <button class="btn" onclick="toggleTop()">VISTA TOPO</button>
  <button class="btn" onclick="resetCam()">RESET CAM</button>
  <button class="btn" onclick="toggleWire()">WIREFRAME</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ── SCENE ──────────────────────────────────────────────────────────────────
var scene    = new THREE.Scene();
var camera   = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 200);
var renderer = new THREE.WebGLRenderer({antialias: true});

scene.fog = new THREE.FogExp2(0x0a0a14, 0.030);
camera.position.set(0, 15, 15);
camera.lookAt(0, 0, 0);
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0a0a14);
document.body.appendChild(renderer.domElement);

// ── LIGHTS ─────────────────────────────────────────────────────────────────
var ambLight = new THREE.AmbientLight(0x9999cc, 0.75);
scene.add(ambLight);

var sun = new THREE.DirectionalLight(0xfff4d0, 1.1);
sun.position.set(8, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.width  = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left   = -14;
sun.shadow.camera.right  =  14;
sun.shadow.camera.top    =  14;
sun.shadow.camera.bottom = -14;
sun.shadow.camera.far    =  60;
scene.add(sun);

var fillLight = new THREE.DirectionalLight(0x4466ff, 0.25);
fillLight.position.set(-6, 8, -6);
scene.add(fillLight);

// ── ROOT GROUP ─────────────────────────────────────────────────────────────
var root = new THREE.Group();
scene.add(root);

var raycaster = new THREE.Raycaster();

// ── MATERIAL FACTORY ───────────────────────────────────────────────────────
function mkMat(col, rough, metal, emi, emiI) {
  return new THREE.MeshStandardMaterial({
    color:            col,
    roughness:        (rough  !== undefined) ? rough  : 0.75,
    metalness:        (metal  !== undefined) ? metal  : 0,
    emissive:         (emi    !== undefined) ? emi    : 0,
    emissiveIntensity:(emiI   !== undefined) ? emiI   : 0
  });
}

var M = {
  tan:   mkMat(0xdec28a, 0.90),
  tan2:  mkMat(0xc9a96e, 0.88),
  edge:  mkMat(0x7a5230, 0.60, 0.1),
  gryff: mkMat(0xb02020, 0.70),
  slyt:  mkMat(0x1a7a3c, 0.70),
  huff:  mkMat(0xcc9010, 0.50, 0.15),
  raven: mkMat(0x1a4a8a, 0.70),
  gold:  mkMat(0xf0c040, 0.20, 0.80, 0xf0c040, 0.30),
  white: mkMat(0xffffff, 0.80),
  lG:    mkMat(0xb02020, 0.6, 0, 0xb02020, 0.20),
  lS:    mkMat(0x1a7a3c, 0.6, 0, 0x1a7a3c, 0.20),
  lH:    mkMat(0xcc9010, 0.5, 0, 0xcc9010, 0.20),
  lR:    mkMat(0x1a4a8a, 0.6, 0, 0x1a4a8a, 0.20)
};

// ── MESH HELPERS ───────────────────────────────────────────────────────────
function addMesh(geo, mat, x, y, z) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow   = true;
  m.receiveShadow = true;
  root.add(m);
  return m;
}

// ── BOARD BASE ─────────────────────────────────────────────────────────────
addMesh(new THREE.BoxGeometry(13.4, 0.55, 13.4), M.edge, 0, -0.30, 0);
addMesh(new THREE.BoxGeometry(12.6, 0.18, 12.6), M.tan,  0,  0.00, 0);

// ── CELL GRID (15x15 Ludo layout) ──────────────────────────────────────────
var CS = 0.74; // cell size

function drawCell(mat, cx, cz) {
  var m = new THREE.Mesh(
    new THREE.BoxGeometry(CS - 0.04, 0.07, CS - 0.04),
    mat
  );
  m.position.set(cx * CS, 0.12, cz * CS);
  m.receiveShadow = true;
  root.add(m);
}

function cellMat(cx, cz) {
  var ax = Math.abs(cx);
  var az = Math.abs(cz);

  // center 3x3 — drawn separately as star
  if (ax <= 1 && az <= 1) { return null; }

  // colored home stretch lanes (single-cell wide, heading to center)
  if (cx === 0  && cz >=  2 && cz <=  6) { return M.lH; }
  if (cx === 0  && cz <= -2 && cz >= -6) { return M.lR; }
  if (cz === 0  && cx >=  2 && cx <=  6) { return M.lS; }
  if (cz === 0  && cx <= -2 && cx >= -6) { return M.lG; }

  // cross arms (3 wide)
  if (az <= 1 && ax <= 7) { return (cx + cz) % 2 === 0 ? M.tan : M.tan2; }
  if (ax <= 1 && az <= 7) { return (cx + cz) % 2 === 0 ? M.tan : M.tan2; }

  // corner house zones
  if (cx <= -2 && cz <= -2) { return M.gryff; }
  if (cx >=  2 && cz <= -2) { return M.slyt;  }
  if (cx <= -2 && cz >=  2) { return M.huff;  }
  if (cx >=  2 && cz >=  2) { return M.raven; }

  return M.tan;
}

for (var cz = -7; cz <= 7; cz++) {
  for (var cx = -7; cx <= 7; cx++) {
    var cm = cellMat(cx, cz);
    if (cm !== null) { drawCell(cm, cx, cz); }
  }
}

// ── CENTER STAR ────────────────────────────────────────────────────────────
var starMats   = [M.gryff, M.slyt, M.huff, M.raven];
var starAngles = [0, Math.PI, Math.PI / 2, -Math.PI / 2];
for (var si = 0; si < 4; si++) {
  var cone = new THREE.Mesh(
    new THREE.ConeGeometry(1.52, 3.04, 4),
    starMats[si]
  );
  cone.rotation.x = Math.PI / 2;
  cone.rotation.z = starAngles[si] + Math.PI / 4;
  cone.position.set(0, 0.22, 0);
  cone.castShadow = true;
  root.add(cone);
}
var goldDisc = addMesh(new THREE.CylinderGeometry(0.42, 0.42, 0.22, 32), M.gold, 0, 0.36, 0);

// ── HOME CIRCLES ───────────────────────────────────────────────────────────
var homeDefs = [
  {mat: M.gryff, cx: -5, cz: -5},
  {mat: M.slyt,  cx:  5, cz: -5},
  {mat: M.huff,  cx: -5, cz:  5},
  {mat: M.raven, cx:  5, cz:  5}
];
var hcOff = [[-0.8,-0.8],[-0.8,0.8],[0.8,-0.8],[0.8,0.8]];
for (var hi = 0; hi < homeDefs.length; hi++) {
  var hd = homeDefs[hi];
  var hbx = hd.cx * CS;
  var hbz = hd.cz * CS;
  for (var hoi = 0; hoi < hcOff.length; hoi++) {
    addMesh(new THREE.CylinderGeometry(0.36, 0.36, 0.06, 24), hd.mat,  hbx + hcOff[hoi][0], 0.18, hbz + hcOff[hoi][1]);
    addMesh(new THREE.CylinderGeometry(0.28, 0.28, 0.04, 24), M.white, hbx + hcOff[hoi][0], 0.22, hbz + hcOff[hoi][1]);
  }
}

// ── ENTRY SAFE DOTS ────────────────────────────────────────────────────────
var eDots = [
  {col: 0xcc2200, x: -6*CS, z:    0},
  {col: 0x22aa44, x:  6*CS, z:    0},
  {col: 0xf0c040, x:     0, z:  6*CS},
  {col: 0x2266cc, x:     0, z: -6*CS}
];
for (var ei = 0; ei < eDots.length; ei++) {
  addMesh(
    new THREE.CylinderGeometry(0.26, 0.26, 0.07, 20),
    mkMat(eDots[ei].col, 0.4, 0.2, eDots[ei].col, 0.5),
    eDots[ei].x, 0.19, eDots[ei].z
  );
}

// ── BOARD BORDER ───────────────────────────────────────────────────────────
var bOff = 6.55;
addMesh(new THREE.BoxGeometry(13.4, 0.44, 0.44), M.edge,  0,     0.08, -bOff);
addMesh(new THREE.BoxGeometry(13.4, 0.44, 0.44), M.edge,  0,     0.08,  bOff);
addMesh(new THREE.BoxGeometry(0.44, 0.44, 13.4), M.edge, -bOff,  0.08,  0);
addMesh(new THREE.BoxGeometry(0.44, 0.44, 13.4), M.edge,  bOff,  0.08,  0);

// ── INVISIBLE FLOOR FOR RAYCASTING ─────────────────────────────────────────
var floorPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(13, 13),
  new THREE.MeshBasicMaterial({visible: false, side: THREE.DoubleSide})
);
floorPlane.rotation.x = -Math.PI / 2;
floorPlane.position.y = 0.20;
floorPlane.name = 'floor';
root.add(floorPlane);

// ── STARS ──────────────────────────────────────────────────────────────────
var starsGeo = new THREE.BufferGeometry();
var sv = [];
for (var sti = 0; sti < 800; sti++) {
  sv.push(
    (Math.random() - 0.5) * 60,
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 60
  );
}
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0xffffff, size:0.07, transparent:true, opacity:0.5})));

// ── SELECTION RING ─────────────────────────────────────────────────────────
var selRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.34, 0.04, 8, 32),
  mkMat(0xffffff, 0.2, 0.8, 0xffffff, 2.0)
);
selRing.rotation.x = Math.PI / 2;
selRing.visible = false;
root.add(selRing);

var destMarker = new THREE.Mesh(
  new THREE.CylinderGeometry(0.20, 0.20, 0.03, 24),
  mkMat(0xffffff, 0.3, 0.5, 0xffffff, 1.0)
);
destMarker.visible = false;
root.add(destMarker);

// ── PAWNS ──────────────────────────────────────────────────────────────────
var pawns      = [];
var pawnMeshes = [];

function makePawn(color, sx, sz, houseName) {
  var g = new THREE.Group();
  g.position.set(sx, 0.12, sz);
  g.userData.isPawn = true;
  g.userData.house  = houseName;
  g.userData.color  = color;

  var bMat = mkMat(color, 0.30, 0.30, color, 0.28);
  var body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.42, 12), bMat);
  body.position.y = 0.21;
  body.castShadow = true;
  body.userData.pawnRef = g;
  g.add(body);
  pawnMeshes.push(body);

  var hMat = mkMat(color, 0.20, 0.40, color, 0.38);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 12), hMat);
  head.position.y = 0.58;
  head.castShadow = true;
  head.userData.pawnRef = g;
  g.add(head);
  pawnMeshes.push(head);

  var ring = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.028, 8, 20), M.gold);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.70;
  ring.userData.pawnRef = g;
  g.add(ring);
  pawnMeshes.push(ring);

  var glow = new THREE.PointLight(color, 0.5, 1.2);
  glow.position.y = 0.4;
  g.add(glow);

  root.add(g);

  return {
    group:     g,
    bob:       Math.random() * Math.PI * 2,
    selected:  false,
    animating: false,
    glow:      glow
  };
}

var pDefs = [
  [0xe84040,'grifinoria',-5.5*CS,-5.5*CS],[0xe84040,'grifinoria',-4.5*CS,-5.5*CS],
  [0xe84040,'grifinoria',-5.5*CS,-4.5*CS],[0xe84040,'grifinoria',-4.5*CS,-4.5*CS],
  [0x40e860,'sonserina',  4.5*CS,-5.5*CS],[0x40e860,'sonserina',  5.5*CS,-5.5*CS],
  [0x40e860,'sonserina',  4.5*CS,-4.5*CS],[0x40e860,'sonserina',  5.5*CS,-4.5*CS],
  [0xf0c040,'lufa-lufa', -5.5*CS, 4.5*CS],[0xf0c040,'lufa-lufa', -4.5*CS, 4.5*CS],
  [0xf0c040,'lufa-lufa', -5.5*CS, 5.5*CS],[0xf0c040,'lufa-lufa', -4.5*CS, 5.5*CS],
  [0x4090f0,'corvinal',   4.5*CS, 4.5*CS],[0x4090f0,'corvinal',   5.5*CS, 4.5*CS],
  [0x4090f0,'corvinal',   4.5*CS, 5.5*CS],[0x4090f0,'corvinal',   5.5*CS, 5.5*CS]
];
for (var pi = 0; pi < pDefs.length; pi++) {
  pawns.push(makePawn(pDefs[pi][0], pDefs[pi][2], pDefs[pi][3], pDefs[pi][1]));
}

// ── SELECTION ──────────────────────────────────────────────────────────────
var selectedPawn = null;

function selectPawn(pawn) {
  if (selectedPawn) { deselect(); }
  selectedPawn      = pawn;
  pawn.selected     = true;
  pawn.glow.intensity = 2.0;
  selRing.visible   = true;
  selRing.position.set(pawn.group.position.x, 0.22, pawn.group.position.z);
  var hex = pawn.group.userData.color.toString(16).padStart(6,'0');
  var lbl = document.getElementById('sel-lbl');
  lbl.textContent      = pawn.group.userData.house.toUpperCase() + ' selecionado';
  lbl.style.color       = '#' + hex;
  lbl.style.borderColor = '#' + hex + '55';
  lbl.style.opacity     = '1';
  document.getElementById('hint').textContent = 'Peao selecionado | CLIQUE no tabuleiro para mover | ESC para cancelar';
}

function deselect() {
  if (!selectedPawn) { return; }
  selectedPawn.selected       = false;
  selectedPawn.glow.intensity = 0.5;
  selectedPawn                = null;
  selRing.visible             = false;
  destMarker.visible          = false;
  document.getElementById('sel-lbl').style.opacity = '0';
  document.getElementById('hint').textContent = 'CLIQUE no peao | CLIQUE no tabuleiro para mover | DRAG para rotar';
}

function movePawnTo(pawn, tx, tz) {
  if (pawn.animating) { return; }
  pawn.animating = true;
  destMarker.position.set(tx, 0.19, tz);
  destMarker.visible = true;
  var ox = pawn.group.position.x;
  var oz = pawn.group.position.z;
  var t  = 0;
  var iv = setInterval(function() {
    t += 0.065;
    var p = Math.min(1, t);
    var e = p < 0.5 ? 2*p*p : -1+(4-2*p)*p;
    pawn.group.position.x = ox + (tx - ox) * e;
    pawn.group.position.z = oz + (tz - oz) * e;
    pawn.group.position.y = 0.12 + Math.sin(Math.min(Math.PI, t * Math.PI)) * 1.1;
    if (pawn.selected) {
      selRing.position.x = pawn.group.position.x;
      selRing.position.z = pawn.group.position.z;
    }
    if (t >= 1) {
      clearInterval(iv);
      pawn.group.position.set(tx, 0.12, tz);
      pawn.animating     = false;
      destMarker.visible = false;
      if (pawn.selected) { selRing.position.set(tx, 0.22, tz); }
    }
  }, 16);
}

// ── CLICK HANDLER ──────────────────────────────────────────────────────────
var mdX = 0, mdY = 0;

renderer.domElement.addEventListener('mousedown', function(e) {
  mdX  = e.clientX;
  mdY  = e.clientY;
  drag = true;
  mpx  = e.clientX;
  mpy  = e.clientY;
  if (e.button === 2) { rDrag = true; }
});

window.addEventListener('mouseup', function(e) {
  if (e.button !== 0) { drag = false; rDrag = false; return; }
  drag = false;
  var dx = e.clientX - mdX;
  var dy = e.clientY - mdY;
  if (Math.sqrt(dx*dx + dy*dy) < 5) { handleClick(e.clientX, e.clientY); }
});

function handleClick(cx, cy) {
  var mv = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mv, camera);

  // Pawn hit?
  var hits = raycaster.intersectObjects(pawnMeshes, false);
  if (hits.length > 0) {
    var ref = hits[0].object.userData.pawnRef;
    for (var i = 0; i < pawns.length; i++) {
      if (pawns[i].group === ref) {
        if (selectedPawn === pawns[i]) { deselect(); }
        else { selectPawn(pawns[i]); }
        return;
      }
    }
    return;
  }

  // Board hit — move selected pawn
  if (selectedPawn && !selectedPawn.animating) {
    var fhits = raycaster.intersectObject(floorPlane, false);
    if (fhits.length > 0) {
      var pt = fhits[0].point;
      movePawnTo(
        selectedPawn,
        Math.max(-6.2, Math.min(6.2, pt.x)),
        Math.max(-6.2, Math.min(6.2, pt.z))
      );
    }
  }
}

// Touch events
var tSX = 0, tSY = 0;
renderer.domElement.addEventListener('touchstart', function(e) {
  drag = true;
  tSX  = mpx = e.touches[0].clientX;
  tSY  = mpy = e.touches[0].clientY;
});
renderer.domElement.addEventListener('touchend', function(e) {
  drag = false;
  if (e.changedTouches.length > 0) {
    var tx = e.changedTouches[0].clientX;
    var ty = e.changedTouches[0].clientY;
    if (Math.sqrt((tx-tSX)*(tx-tSX)+(ty-tSY)*(ty-tSY)) < 8) { handleClick(tx, ty); }
  }
});
renderer.domElement.addEventListener('touchmove', function(e) {
  if (!drag) { return; }
  var dx = e.touches[0].clientX - mpx;
  var dy = e.touches[0].clientY - mpy;
  mpx = e.touches[0].clientX;
  mpy = e.touches[0].clientY;
  azim  -= dx * 0.008;
  polar  = Math.max(0.05, Math.min(1.5, polar + dy * 0.007));
  updateCam();
});

// ── CAMERA ORBIT ───────────────────────────────────────────────────────────
var drag = false, rDrag = false, mpx = 0, mpy = 0;
var polar = 0.85, azim = 0.4, camR = 19, panX = 0, panY = 0;
var autoRot = true, topView = false;

function updateCam() {
  if (topView) {
    camera.position.set(0, 23, 0.001);
    camera.lookAt(0, 0, 0);
    return;
  }
  camera.position.set(
    panX + camR * Math.sin(polar) * Math.sin(azim),
    panY + camR * Math.cos(polar),
    camR * Math.sin(polar) * Math.cos(azim)
  );
  camera.lookAt(panX, panY - 1, 0);
}
updateCam();

window.addEventListener('mousemove', function(e) {
  if (!drag) { return; }
  var dx = e.clientX - mpx;
  var dy = e.clientY - mpy;
  mpx = e.clientX;
  mpy = e.clientY;
  if (rDrag) { panX -= dx * 0.01; panY += dy * 0.01; }
  else {
    azim  -= dx * 0.008;
    polar  = Math.max(0.05, Math.min(1.5, polar + dy * 0.007));
  }
  updateCam();
});

renderer.domElement.addEventListener('wheel', function(e) {
  camR = Math.max(5, Math.min(36, camR + e.deltaY * 0.022));
  updateCam();
});
renderer.domElement.addEventListener('contextmenu', function(e) { e.preventDefault(); });

// ── GAME ───────────────────────────────────────────────────────────────────
var houses  = ['grifinoria','sonserina','lufa-lufa','corvinal'];
var hNames  = {grifinoria:'GRIFINORIA', sonserina:'SONSERINA', 'lufa-lufa':'LUFA-LUFA', corvinal:'CORVINAL'};
var hColors = {grifinoria:'#e84040',    sonserina:'#40e860',   'lufa-lufa':'#f0c040',   corvinal:'#4090f0'};
var curHouse = 0;
var rolling  = false;
var dSym = ['\u2680','\u2681','\u2682','\u2683','\u2684','\u2685'];

function rollDice() {
  if (rolling) { return; }
  rolling = true;
  var n = 0;
  var iv = setInterval(function() {
    var v = Math.floor(Math.random() * 6);
    document.getElementById('dface').textContent = dSym[v];
    document.getElementById('dval').textContent  = 'VALOR: ' + (v + 1);
    if (++n > 15) { clearInterval(iv); rolling = false; }
  }, 65);
}

var wireframe = false;
function toggleWire() {
  wireframe = !wireframe;
  root.traverse(function(o) {
    if (o.isMesh && o.material) { o.material.wireframe = wireframe; }
  });
}
function toggleAuto() { autoRot = !autoRot; }
function toggleTop()  { topView = !topView; updateCam(); }
function resetCam()   { polar = 0.85; azim = 0.4; camR = 19; panX = 0; panY = 0; topView = false; updateCam(); }

window.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); rollDice(); }
  if (e.code === 'Escape') { deselect(); }
  if (e.code === 'Enter') {
    deselect();
    curHouse = (curHouse + 1) % 4;
    var el = document.getElementById('tname');
    el.textContent  = hNames[houses[curHouse]];
    el.style.color  = hColors[houses[curHouse]];
  }
});
window.addEventListener('resize', function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── ANIMATION LOOP ─────────────────────────────────────────────────────────
var clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();

  if (autoRot && !topView) { azim += 0.003; updateCam(); }

  for (var i = 0; i < pawns.length; i++) {
    var pw = pawns[i];
    if (!pw.animating) {
      pw.group.position.y = 0.12 + Math.sin(t * 1.8 + pw.bob) * 0.035;
    }
    pw.group.rotation.y += pw.selected ? 0.05 : 0.012;
    if (pw.selected) {
      pw.glow.intensity = 1.8 + Math.sin(t * 4) * 0.5;
    }
  }

  if (selRing.visible) {
    var pulse = 1 + Math.sin(t * 6) * 0.08;
    selRing.scale.set(pulse, pulse, pulse);
    if (selectedPawn && !selectedPawn.animating) {
      selRing.position.x = selectedPawn.group.position.x;
      selRing.position.z = selectedPawn.group.position.z;
      selRing.position.y = 0.22 + Math.sin(t * 3) * 0.02;
    }
  }

  goldDisc.rotation.y += 0.018;
  renderer.render(scene, camera);
}

animate();
</script>
</body>
