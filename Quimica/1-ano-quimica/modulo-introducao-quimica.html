<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Aulas - Teorema das Coisas</title>
    
    <link rel="stylesheet" href="../../style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="icon" type="image/png" href="../../Imagens/logo-teorema-das-coisas.png">
<link rel="apple-touch-icon" href="../../Imagens/logo-teorema-das-coisas.png">
    <style>
        /* CONFIGURAÇÕES DE CORES LOCAIS: Definem a identidade visual da página de vídeo */
        :root {
            --video-bg: #0f172a;      /* Azul muito escuro para o fundo */
            --sidebar-bg: #1e293b;    /* Azul um pouco mais claro para a lateral */
            --accent-green: #22c55e;  /* Verde para botões de conclusão e progresso */
            --text-white: #ffffff;
        }

        body { background-color: var(--video-bg) !important; color: white; }

        /* Estrutura principal que divide o vídeo da lista lateral */
        .course-container {
            display: flex;
            flex-wrap: wrap;
            margin-top: 80px;
            min-height: calc(100vh - 80px);
        }

        /* Seção onde o vídeo do YouTube é exibido */
        .video-section { 
            flex: 3; 
            padding: 30px; 
            min-width: 65%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Estilização do link de retorno aos módulos */
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-voltar:hover { color: var(--accent-green); }
        
        /* Container para manter a proporção 16:9 do vídeo do YouTube */
        .video-player-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .video-player-container iframe {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none;
        }

        /* Barra abaixo do vídeo com título e botão de conclusão */
        .video-footer {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            gap: 15px;
        }

        .video-title { font-family: 'Outfit'; font-size: 1.6rem; color: var(--text-white); margin: 0; }

        .btn-complete { background: transparent; border: 2px solid var(--accent-green); color: var(--accent-green); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 10px; transition: 0.3s; white-space: nowrap; }

        .btn-complete.done { background: var(--accent-green); color: #0f172a; }



        /* Barra Lateral (Sidebar) com a lista de aulas */
        .sidebar {
            flex: 1;
            min-width: 350px;
            background: var(--sidebar-bg);
            border-left: 1px solid #334155;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }
 
        .sidebar-title { padding: 25px; border-bottom: 1px solid #334155; font-family: 'Outfit'; }

        .lesson-list { list-style: none; padding: 0; margin: 0; }
   
        .lesson-link { padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #334155; transition: 0.2s; }
        .lesson-link:hover { background: #334155; }
      

        /* Efeito visual para a aula que está sendo assistida no momento */
        .lesson-link.active {
            background: #0f172a;
            border-left: 5px solid var(--accent-green);
        }

         .lesson-circle { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #475569; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #94a3b8; flex-shrink: 0; }
       

        /* Estilo para quando o aluno marca a aula como pronta */
        .lesson-link.finished .lesson-circle {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #0f172a;
        }
        
        .lesson-text { color: #cbd5e1; font-size: 0.95rem; }
         
        /* Responsividade: No celular, a lista de aulas vai para debaixo do vídeo */
        @media (max-width: 1024px) {
            .course-container { flex-direction: column; }
            .sidebar { max-height: none; width: 100%; border-left: none; }
            .video-section { max-width: 100%; }
        }
    </style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XJVMG0NXLE"></script>

</script>

</head>
<body class="tema-biologia">

<header></header>

<main class="course-container"> 
    <section class="video-section">

        <a href="../Modulos-aula-1ano-quimica.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar para os módulos
        </a>

        <div class="video-player-container">
            <iframe id="video-frame" src="" allowfullscreen></iframe>
        </div>
        
        <div class="video-footer">
            <h2 class="video-title" id="display-title">Carregando aula...</h2>
            <button class="btn-complete" id="btn-status" onclick="toggleProgress()">
                <i class="fa-regular fa-circle-check"></i>
                <span>Marcar como Concluída</span>
            </button>
        </div>

        <p style="margin-top: 20px; color: #94a3b8;">
            Bem-vindo ao módulo Introdução a Química 1º Ano. Assista ao vídeo e utilize a lista lateral para navegar entre as lições.
        </p>
    </section>

    <aside class="sidebar">
        <h3 class="sidebar-title">Módulo: Introdução a Química 1º Ano</h3>
        <ul class="lesson-list" id="lesson-list-container"></ul>
    </aside>
</main>

<script src="../../menu.js"></script>

<script>
    /* BANCO DE DADOS DAS AULAS: Facilita adicionar novos vídeos no futuro */
    const lessons = [
        { id: "QUI1_01", title: "📌 O que é Química ? Explicação Simples!", ytId: "PCMqFOq4ZB8" },
        { id: "QUI1_02", title: "📌 Conceitos de Matéria, Transformações e Fenômenos Materiais", ytId: "TbnpQBwfByQ" }
    ];

    let currentIdx = 0;
    // Puxa o progresso salvo no navegador do aluno (LocalStorage)
    let progress = JSON.parse(localStorage.getItem('teorema_progresso')) || {};

    /* FUNÇÃO: Desenha a lista de aulas na barra lateral */
    function renderLessons() {
        const container = document.getElementById('lesson-list-container');
        container.innerHTML = "";
        
        lessons.forEach((lesson, index) => {
            const isFinished = progress[lesson.id];
            const isActive = index === currentIdx;
            
            const li = document.createElement('li');
            li.className = `lesson-link ${isActive ? 'active' : ''} ${isFinished ? 'finished' : ''}`;
            li.onclick = () => loadLesson(index); // Troca o vídeo ao clicar
            
            li.innerHTML = `
                <div class="lesson-circle">
                    ${isFinished ? '<i class="fa-solid fa-check"></i>' : index + 1}
                </div>
                <span class="lesson-text">${lesson.title}</span>
            `;
            container.appendChild(li);
        });
    }

    /* FUNÇÃO: Troca o vídeo no player do YouTube */
    function loadLesson(index) {
        currentIdx = index;
        const lesson = lessons[index];
        
        document.getElementById('video-frame').src =
            `https://www.youtube.com/embed/${lesson.ytId}?rel=0&autoplay=1`;
        document.getElementById('display-title').innerText = lesson.title;
        
        updateButtonUI();
        renderLessons();
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Sobe a página ao trocar de aula
    }

    /* FUNÇÃO: Salva ou remove o progresso da aula no navegador */
    function toggleProgress() {
        const lessonId = lessons[currentIdx].id;
        progress[lessonId] = !progress[lessonId];
        localStorage.setItem('teorema_progresso', JSON.stringify(progress));
        
        updateButtonUI();
        renderLessons();
    }

    /* FUNÇÃO: Muda a cor e o texto do botão de "Concluir" */
    function updateButtonUI() {
        const btn = document.getElementById('btn-status');
        const lessonId = lessons[currentIdx].id;
        
        if (progress[lessonId]) {
            btn.classList.add('done');
            btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>Aula Concluída</span>`;
        } else {
            btn.classList.remove('done');
            btn.innerHTML = `<i class="fa-regular fa-circle-check"></i> <span>Marcar como Concluída</span>`;
        }
    }

    // Inicia a página carregando a primeira lição da lista
    window.onload = () => loadLesson(0);
</script>

</body>
</html>
